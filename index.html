", "Intermediate Event (Peristiwa Antara), yang terjadi di antara Start dan End.", "Gateway Event (Peristiwa Gerbang), yang merupakan sebuah keputusan."], "a": 2, "e": "Event di tengah alur (antara start dan end) = Intermediate Event.", "f": false, "t": 2}, {"n": 79, "q": "Tujuan utama penggunaan UML Diagram dalam rekayasa perangkat lunak adalah ....", "o": ["mempercepat proses kompilasi kode sumber", "menampilkan data numerik dalam bentuk grafik", "membantu komunikasi dan dokumentasi desain sistem secara terstandar", "menyimpan data hasil analisis ke dalam basis data"], "a": 2, "e": "UML membantu komunikasi dan dokumentasi desain sistem secara terstandar.", "f": false, "t": 2}, {"n": 80, "q": "PERT (Program Evaluation and Review Technique) digunakan untuk ....", "o": ["menggambarkan alur logika sistem perangkat lunak", "menganalisis dan menjadwalkan tugas-tugas dalam suatu proyek secara terstruktur", "menampilkan hubungan antarentitas dalam basis data", "menggambarkan aliran data dalam suatu proses bisnis"], "a": 1, "e": "PERT untuk menganalisis dan menjadwalkan tugas proyek.", "f": false, "t": 2}, {"n": 81, "q": "Saat meracik kopi, barista mengambil biji kopi (1), menggilingnya menggunakan mesin espreso (2), lalu menyajikannya panas (3). Pemetaan Input-Process-Output yang tepat adalah ....", "o": ["Input (3), Process (2), Output (1).", "Input (2), Process (1), Output (3).", "Input (1), Process (2), Output (3).", "Input (1), Process (3), Output (2)."], "a": 2, "e": "Biji kopi = input, menggiling = proses, kopi tersaji = output.", "f": false, "t": 0}, {"n": 82, "q": "Urutan tahapan yang benar untuk siklus DMADV (yang digunakan untuk merancang proses baru) adalah ....", "o": ["Define => Measure => Analyze => Design => Verify", "Define => Measure => Analyze => Improve => Control", "Design => Measure => Analyze => Define => Verify", "Define => Model => Act => Design => Validate"], "a": 0, "e": "DMADV: Define, Measure, Analyze, Design, Verify.", "f": false, "t": 1}, {"n": 83, "q": "Memetakan pihak luar yang terdampak proyek dan menyusun strategi untuk mempertahankan dukungan mereka merupakan fungsi dari area ....", "o": ["Manajemen Komunikasi Proyek.", "Manajemen Pemangku Kepentingan.", "Manajemen Sumber Daya Proyek.", "Manajemen Integrasi Proyek."], "a": 1, "e": "Mengelola pihak terdampak dan dukungannya = Manajemen Pemangku Kepentingan.", "f": false, "t": 3}, {"n": 84, "q": "Aktivitas seperti 'Melakukan serah terima final kepada klien', 'Mendapatkan persetujuan formal (sign-off)', dan 'Mengarsipkan lessons learned' adalah ciri khas dari fase ....", "o": ["Planning (Perencanaan)", "Executing (Pelaksanaan)", "Monitoring & Controlling (Pemantauan)", "Closing (Penutupan)"], "a": 3, "e": "Serah terima, sign-off, arsip lessons learned = fase Closing.", "f": false, "t": 3}, {"n": 85, "q": "Apa output (keluaran) utama yang dihasilkan dari proses 'Plan Procurement Management' (Merencanakan Manajemen Pengadaan)....", "o": ["Procurement Management Plan dan Procurement Statement of Work (SOW).", "Daftar vendor yang terpilih (selected sellers) dan kontrak yang sudah ditandatangani.", "Proposal dan penawaran harga (bids/proposals) yang diterima dari para vendor.", "Laporan kinerja vendor dan permintaan perubahan (change requests) yang disetujui."], "a": 0, "e": "Output Plan Procurement Management: procurement management plan dan procurement SOW.", "f": false, "t": 3}, {"n": 86, "q": "Manajer proyek IT sedang merinci berapa jumlah server, lisensi software, dan programmer yang dibutuhkan. Daftar yang mengklasifikasikan sumber daya ini disebut ....", "o": ["project scope statement", "resource breakdown structure", "organizational process assets", "communications plan"], "a": 1, "e": "Klasifikasi hierarkis sumber daya = Resource Breakdown Structure (RBS).", "f": false, "t": 3}, {"n": 87, "q": "Dalam proses 'Control Costs', Manajer Proyek membandingkan Planned Value (PV - anggaran rencana), Earned Value (EV - nilai pekerjaan selesai), dan Actual Cost (AC - biaya aktual) untuk mengukur kinerja. Metode ini disebut ....", "o": ["Earned Value Management (EVM)", "Critical Path Method (CPM)", "Work Breakdown Structure (WBS)", "Root Cause Analysis (RCA)"], "a": 0, "e": "Membandingkan PV, EV, AC = Earned Value Management.", "f": false, "t": 3}, {"n": 88, "q": "Selama proyek berlangsung, manajer proyek secara rutin meninjau Risk Register untuk melacak risiko yang ada, mengidentifikasi risiko baru (new risks), dan mengevaluasi efektivitas respons. Proses berkelanjutan ini disebut ....", "o": ["Perform Qualitative Risk Analysis", "Implement Risk Responses", "Monitor Risks", "Plan Risk Management"], "a": 2, "e": "Meninjau risk register dan mencari risiko baru secara berkala = Monitor Risks.", "f": false, "t": 3}, {"n": 89, "q": "Manakah pernyataan yang paling akurat menjelaskan TUJUAN utama dari diterapkannya proses manajemen perubahan (change control) dalam sebuah proyek....", "o": ["Untuk mencegah semua perubahan (change request) agar proyek selesai sesuai rencana awal.", "Untuk memastikan bahwa semua perubahan yang diminta langsung disetujui dan diimplementasikan.", "Untuk mendokumentasikan semua perubahan yang sudah terjadi secara informal.", "Untuk meninjau, mengevaluasi dampak, dan menyetujui atau menolak perubahan sebelum diimplementasikan."], "a": 3, "e": "Change control meninjau dampak lalu menyetujui atau menolak perubahan sebelum diterapkan.", "f": false, "t": 3}, {"n": 90, "q": "Dalam model konversi pengetahuan SECI, seorang teknisi junior belajar memperbaiki mesin (mendapat tacit knowledge) dengan cara mengamati dan magang langsung dengan teknisi senior (pemilik tacit knowledge). Proses transfer Tacit-ke-Tacit ini disebut ....", "o": ["Socialization (Sosialisasi)", "Externalization (Eksternalisasi)", "Combination (Kombinasi)", "Internalization (Internalisasi)"], "a": 0, "e": "Tacit → tacit lewat pengamatan/magang = Socialization.", "f": false, "t": 4}, {"n": 91, "q": "Programmer junior membaca buku panduan API (Explicit Knowledge). Setelah beberapa bulan membuat aplikasi menggunakan API tersebut, coding fungsi itu telah melekat menjadi insting/keterampilan otomatis di benaknya (Tacit). Ini disebut ....", "o": ["externalization", "internalization", "mentoring sistem pakar", "combination"], "a": 1, "e": "Explicit → tacit (belajar sampai jadi keterampilan) = Internalization.", "f": false, "t": 4}, {"n": 92, "q": "Siklus manajemen pengetahuan menurut Meyer dan Zack dimulai dari tahap ....", "o": ["storage", "acquisition", "dissemination", "utilization"], "a": 1, "e": "Siklus Meyer & Zack dimulai dari akuisisi (acquisition), lalu refinement, storage, distribution, presentation.", "f": false, "t": 4}, {"n": 93, "q": "Perusahaan A fokus membuat database lessons learned dan Wiki internal agar pengetahuan explicit tersimpan (strategi people-to-document). Perusahaan B fokus membuat SI expert locator (profil keahlian) agar orang bisa saling bertanya (strategi people-to-people). Manakah klasifikasi strategi KM yang tepat ....", "o": ["Perusahaan A: Personalisasi; Perusahaan B: Kodifikasi.", "Perusahaan A: Kodifikasi; Perusahaan B: Personalisasi.", "Keduanya menggunakan strategi Kodifikasi.", "Keduanya menggunakan strategi Personalisasi."], "a": 1, "e": "People-to-document = kodifikasi; people-to-people = personalisasi.", "f": false, "t": 4}, {"n": 94, "q": "Perusahaan A menggunakan satu sistem ERP terintegrasi dari SAP. Perusahaan B menggunakan sistem akuntansi khusus (misal: Accurate), sistem HR khusus (misal: Talenta), dan sistem SCM khusus (misal: WMS custom), yang datanya harus dijembatani (interface) satu sama lain. Pendekatan Sistem Informasi yang digunakan Perusahaan B disebut ....", "o": ["ERP (Enterprise Resource Planning)", "EIS (Executive Information System)", "TPS (Transaction Processing System)", "Best-of-Breed (Standalone)"], "a": 3, "e": "Memakai aplikasi terbaik untuk tiap fungsi lalu diintegrasikan = Best-of-Breed.", "f": false, "t": 5}, {"n": 95, "q": "Arsitek perangkat lunak diminta memvisualisasikan prosedur integrasi software yang dengan tegas menggarisbawahi tanggung jawab batas area horizontal (Swimlanes) antara \"Server Otentikasi\" dan \"Database Master\". Standar notasi bisnis yang paling dianjurkan adalah ....", "o": ["BPMN, karena fitur standarnya mendukung penggunaan Pool dan Lanes kolaboratif", "DFD Level 0, karena diagram ini unggul mengatur pendelegasian hierarki staf", "Flowchart linier, karena sangat intuitif mendeskripsikan peran departemen", "State Diagram, karena mumpuni melacak siklus perpindahan paket byte kompleks"], "a": 0, "e": "Pool dan Lanes (swimlanes) adalah fitur standar BPMN.", "f": false, "t": 2}]}, {"code": "STSI4207", "name": "Sistem Informasi Manajemen", "topics": ["Konsep SI & organisasi", "Etika & HKI", "Infrastruktur & jaringan", "Keamanan & audit", "Data & pengetahuan", "Enterprise & e-commerce", "Keputusan & BI", "Pengembangan & proyek"], "qs": [{"n": 1, "q": "Menurut (Laudon & Laudon, 2018) informasi adalah ....", "o": ["jalur yang memfasilitasi aliran sumber daya fisik dari pemasok kepada perusahaan dan selanjutnya kepada pelanggan", "data yang sudah mengalami pengolahan sedemikian rupa sehingga dapat digunakan oleh penggunanya dalam membuat keputusan", "sekumpulan komponen yang saling berinteraksi dan bekerja sama untuk mencapai tujuan yang sama", "satu atribut (satu set atribut) yang melengkapi satu relationship (hubungan) yang menunjukkan ke induknya"], "a": 1, "e": "Laudon: informasi adalah data yang sudah diolah sehingga bermakna dan berguna untuk mengambil keputusan.", "f": false, "t": 0}, {"n": 2, "q": "Menurut (Turban et al, 2018), prosedur atau proses merupakan aspek sistem informasi dari segi ....", "o": ["teknologi", "non teknologi", "pengelolaan dan penyimpanan data", "manusia"], "a": 1, "e": "Turban membagi aspek SI menjadi teknologi dan non-teknologi; prosedur/proses termasuk non-teknologi.", "f": false, "t": 0}, {"n": 3, "q": "Salah satu inovasi dalam bidang teknologi informasi yang diakibatkan perkembangan teknologi informasi yang mendorong beberapa perubahan dalam dunia bisnis adalah ....", "o": ["komputasi awan (cloud computing)", "database", "software", "otomatisasi kantor"], "a": 0, "e": "Cloud computing adalah inovasi TI yang mendorong perubahan bisnis.", "f": false, "t": 0}, {"n": 4, "q": "Biaya distribusi produk digital menjadi sangat murah dan dapat menekan harga jual dikarenakan didistribusikan menggunakan ....", "o": ["pemasok", "konsumen", "jaringan", "Internet"], "a": 3, "e": "Produk digital didistribusikan lewat Internet dengan biaya hampir nol.", "f": false, "t": 0}, {"n": 5, "q": "Operations Research menurut (Laudon & Laudon, 2018) merupakan pengaruh besar dalam perkembangan ....", "o": ["Sistem Informasi Akuntansi", "Analis Sistem", "Sistem Komputer", "Sistem Informasi Manajemen"], "a": 3, "e": "Operations research (pendekatan teknis) berpengaruh besar pada perkembangan SIM.", "f": false, "t": 0}, {"n": 6, "q": "Netflix mengubah bisnis utamanya dari persewaan DVD (Digital Versatile Disk) melalui pos menjadi layanan streaming pada awal dekade ....", "o": ["1990an", "2000an", "2010an", "2020an"], "a": 1, "e": "Netflix mulai layanan streaming pada 2007, yaitu dekade 2000-an.", "f": false, "t": 0}, {"n": 7, "q": "Sistem pengolahan transaksi dan sistem intelegensi bisnis merupakan fungsi dari ....", "o": ["sistem informasi perusahaan.", "sistem informasi berbasis internet.", "sistem manual dalam organisasi.", "sistem komunikasi pribadi."], "a": 0, "e": "TPS dan sistem BI adalah fungsi sistem informasi perusahaan.", "f": false, "t": 0}, {"n": 8, "q": "Pada perusahaan besar, Chief Knowledge Officer bertanggung jawab terhadap ....", "o": ["Pengelolaan dan pemanfaatan data perusahaan", "Pengelolaan pengetahuan perusahaan", "Kepatuhan regulasi privasi data perusahaan", "Keamanan sistem informasi perusahaan"], "a": 1, "e": "Chief Knowledge Officer (CKO) bertanggung jawab atas program manajemen pengetahuan.", "f": false, "t": 0}, {"n": 9, "q": "Organisasi merupakan produsen barang dan jasa yang mendapatkan faktor produksi dari ....", "o": ["Teman kantor yang fleksibel dan luwes", "Lingkungan sekitar", "budaya organisasi", "sumber daya"], "a": 1, "e": "Organisasi mengambil faktor produksi (modal, tenaga kerja) dari lingkungannya.", "f": false, "t": 0}, {"n": 10, "q": "Menurut (Dennis, Roth, & Wixom, 2012; Hoffer, George, & Valacich, 2011), salah satu hal yang menjadi pertimbangan untuk menerapkan sistem informasi baru di dalam sebuah perusahaan adalah ....", "o": ["pengetahuan dan informasi", "struktur dan hirarki organisasi", "kemampuan menggunakan sumber daya", "akses pada sumber daya"], "a": 0, "e": "Pertimbangan penerapan SI menurut Dennis dkk. di BMP mencakup pengetahuan & informasi. Pilihan B dan C juga mirip istilah di modul, jadi cocokkan lagi.", "f": true, "t": 0}, {"n": 11, "q": "Pada dekade tahun berapakah Indonesia menjadi surga bagi pelaku kejahatan “carding”?", "o": ["1980an", "1990an", "2000an", "2010an"], "a": 2, "e": "Indonesia dikenal sebagai 'surga carding' pada awal 2000-an.", "f": true, "t": 1}, {"n": 12, "q": "Aturan yang memungkinkan orang yang dirugikan oleh suatu tindakan untuk mendapatkan kompensasi yang layak dinamakan ....", "o": ["analisa etika", "akuntabilitas", "liabilitas", "dilema etika"], "a": 2, "e": "Liabilitas: aturan hukum yang memungkinkan pihak yang dirugikan mendapat kompensasi.", "f": false, "t": 1}, {"n": 13, "q": "Mengidentifikasi aplikasi perambah apa yang digunakan pengunjung dan melacak aktivitas pengunjung selama kunjungannya adalah kemampuan dari ....", "o": ["cookies", "privacy policy", "spam", "spyware"], "a": 0, "e": "Cookies mengidentifikasi browser pengunjung dan melacak aktivitasnya di situs.", "f": false, "t": 1}, {"n": 14, "q": "Hak eksklusif bagi pencipta atau penerima hak untuk mengumumkan atau memperbanyak ciptaannya adalah pengertian dari ....", "o": ["hak paten", "hak cipta", "merek dagang", "rahasia dagang"], "a": 1, "e": "Hak cipta: hak eksklusif pencipta untuk mengumumkan atau memperbanyak ciptaannya.", "f": false, "t": 1}, {"n": 15, "q": "Suatu kreasi tentang bentuk, konfigurasi atau komposisi garis atau warna, atau gabungan daripadanya yang berbentuk tiga dimensi atau dua dimensi yang memberikan kesan estetis dan dapat diwujudkan dalam pola tiga dimensi atau dua dimensi serta dapat dipakai untuk menghasilkan suatu produk, barang, komoditas industri, atau kerajinan tangan adalah pengertian dari ....", "o": ["rahasia dagang", "hak cipta", "merek dagang", "desain industri"], "a": 3, "e": "Kreasi bentuk, konfigurasi, garis, atau warna yang memberi kesan estetis = desain industri.", "f": false, "t": 1}, {"n": 16, "q": "Menghubungkan karyawan, pelanggan, dan pemasok dalam satu lingkungan digital yang terakomodir dengan baik adalah fungsi dari ....", "o": ["layanan komputasi", "layanan telekomunikasi", "layanan pengelolaan data", "layanan edukasi teknologi informasi"], "a": 1, "e": "Layanan telekomunikasi menghubungkan karyawan, pelanggan, dan pemasok.", "f": false, "t": 2}, {"n": 17, "q": "Contoh mini-computer yang berukuran lebih kecil dan murah antara lain adalah ....", "o": ["PDP12", "PDP11", "Lotus 123", "Lotus 121"], "a": 1, "e": "PDP-11 (DEC) adalah contoh minikomputer.", "f": false, "t": 2}, {"n": 18, "q": "IBM PC memulai era penggunaan komputer secara lebih luas terjadi pada tahun ....", "o": ["1983", "1982", "1981", "1980"], "a": 2, "e": "IBM PC diluncurkan tahun 1981.", "f": false, "t": 2}, {"n": 19, "q": "Jaringan Komputer adalah ....", "o": ["kumpulan perangkat lunak yang mengatur alur data dalam satu komputer", "dua atau lebih komputer yang saling terhubung sehingga dapat bertukar data dan berbagi sumber daya komputasi", "proses pengiriman data antara perangkat melalui perangkat penyimpanan eksternal", "mekanisme untuk mempercepat kinerja prosesor dalam satu komputer"], "a": 1, "e": "Jaringan komputer: dua komputer atau lebih yang terhubung untuk bertukar data dan berbagi sumber daya.", "f": false, "t": 2}, {"n": 20, "q": "Protokol komunikasi yang digunakan dalam internet adalah ....", "o": ["Domain name server (DNS)", "Package switching", "Router", "TCP/IP"], "a": 3, "e": "Internet memakai protokol TCP/IP.", "f": false, "t": 2}, {"n": 21, "q": "Virus komputer didefinisikan sebagai ....", "o": ["perangkat keras yang digunakan untuk menghapus data di komputer secara otomatis", "perangkat lunak jahat yang menempelkan diri pada perangkat lunak atau data lain", "sistem operasi yang berjalan di latar belakang dan mempercepat kinerja komputer", "aplikasi keamanan yang mencegah ancaman dari internet dan perangkat lunak berbahaya"], "a": 1, "e": "Virus: program jahat yang menempelkan diri pada program atau data lain.", "f": false, "t": 3}, {"n": 22, "q": "Salah satu metode masuknya malware adalah dengan menggunakan aplikasi yang tergolong sebagai ....", "o": ["kuda troya", "malicious", "virus komputer", "worm"], "a": 0, "e": "Kuda troya (trojan) tampak seperti aplikasi wajar padahal membawa malware.", "f": false, "t": 3}, {"n": 23, "q": "Aplikasi yang ketika terpasang pada suatu komputer yang akan memata-matai aktivitas pengguna tanpa disadari adalah ....", "o": ["Spoofing", "Sniffing", "Spyware", "Hacktivist"], "a": 2, "e": "Spyware memata-matai aktivitas pengguna tanpa disadari.", "f": false, "t": 3}, {"n": 24, "q": "Proses untuk menentukan skala prioritas berbagai potensi bahaya dan merencanakan langkah-langkah mitigasi yang diperlukan disebut ....", "o": ["risiko", "kebijakan", "manajemen risiko", "pengendalian"], "a": 2, "e": "Manajemen risiko: memprioritaskan potensi bahaya dan merencanakan mitigasi.", "f": false, "t": 3}, {"n": 25, "q": "Salah satu alat audit yang sering digunakan adalah ....", "o": ["rekomendasi perbaikan", "menutupi kelemahan sistem", "laporan untuk pengembangan berikutnya", "penetration testing"], "a": 3, "e": "Penetration testing adalah alat audit keamanan; pilihan lain adalah isi atau hasil audit.", "f": false, "t": 3}, {"n": 26, "q": "Sekumpulan record dengan tipe yang sama disebut ....", "o": ["Field", "File", "Basis data", "byte"], "a": 1, "e": "Kumpulan record sejenis = file.", "f": false, "t": 4}, {"n": 27, "q": "Setiap entitas memiliki karakteristik yang membedakan dengan entitas lain disebut ....", "o": ["record", "field", "file", "atribut"], "a": 3, "e": "Karakteristik yang mendeskripsikan entitas = atribut.", "f": false, "t": 4}, {"n": 28, "q": "Teknik komputasi yang memanfaatkan RAM komputer disebut ....", "o": ["in-memory computing", "online analytical processing (OLAP)", "query", "hadoop distributed file systems"], "a": 0, "e": "In-memory computing memproses data di RAM, bukan di disk.", "f": false, "t": 4}, {"n": 29, "q": "Permasalahan utama dalam mengelola manajemen pengetahuan adalah ....", "o": ["pengetahuan yang bersifat tacit", "prosedur operasional", "pengetahuan dan dokumentasi", "membuat taksonomi yang sesuai"], "a": 0, "e": "Pengetahuan tacit sulit didokumentasikan dan dibagikan, sehingga jadi masalah utama KM.", "f": false, "t": 4}, {"n": 30, "q": "Computer-Aided Design (CAD) digunakan untuk membuat rancangan produk dan memanipulasi secara ....", "o": ["tiga dimensi", "realita maya", "grafis", "perangkat komputasi"], "a": 0, "e": "CAD dipakai untuk merancang dan memanipulasi produk secara tiga dimensi.", "f": false, "t": 4}, {"n": 31, "q": "Permasalahan dengan Perusahaan berskala besar adalah ....", "o": ["mudah beradaptasi dengan perubahan", "informasi yang lebih cepat dan efisien", "komunikasi dan koordinasi antar divisi", "manajemen yang sangat sederhana"], "a": 2, "e": "Perusahaan besar sulit berkomunikasi dan berkoordinasi antardivisi.", "f": false, "t": 5}, {"n": 32, "q": "Berikut adalah salah satu proses pada Enterprise Resource Planning (ERP) modul Akuntansi dan keuangan kecuali ....", "o": ["Akuntansi biaya", "Penggajian", "Pajak", "Manajemen kredit"], "a": 1, "e": "Penggajian ada di modul SDM, bukan akuntansi dan keuangan.", "f": false, "t": 5}, {"n": 33, "q": "Rangkaian Perusahaan dan organisasi yang memasok bahan baku ke pabrikan adalah pengertian dari ....", "o": ["segmen internal", "segmen hilir", "segmen hulu", "bahan baku"], "a": 2, "e": "Pemasok bahan baku ke pabrik = segmen hulu (upstream).", "f": false, "t": 5}, {"n": 34, "q": "Perdagangan elektronik mulai berkembang tahun 1995 bersamaan dengan mulai populernya penggunaan Internet di kalangan rumah tangga. Salah satu pelaku bisnis pada jaman itu adalah ....", "o": ["Netscape.com", "Microsoft.com", "Bing.com", "Amazon.com"], "a": 3, "e": "Amazon.com berdiri tahun 1995 sebagai pelaku e-commerce awal.", "f": false, "t": 5}, {"n": 35, "q": "Perdagangan elektronik memungkinkan terjadinya ....", "o": ["asimetri", "digitalisasi", "disintermediasi", "perubahan layanan"], "a": 2, "e": "E-commerce memungkinkan disintermediasi (memangkas perantara).", "f": false, "t": 5}, {"n": 36, "q": "Dampak keputusan terstruktur biasanya berjangka waktu pendek kurang dari ....", "o": ["1 hari", "1 minggu", "1 bulan", "1 tahun"], "a": 3, "e": "Keputusan terstruktur (operasional) berdampak jangka pendek; batas yang lazim dipakai kurang dari 1 tahun. Cocokkan dengan BMP.", "f": true, "t": 6}, {"n": 37, "q": "Yang termasuk fungsi manajemen yaitu ....", "o": ["inovasi", "produksi", "perencanaan", "negosiator"], "a": 2, "e": "Fungsi manajemen: perencanaan, pengorganisasian, koordinasi, pengambilan keputusan, pengendalian.", "f": false, "t": 6}, {"n": 38, "q": "Pada peran manajerial sebagai pembuat keputusan, manajer berfungsi untuk ....", "o": ["Mengelola arus informasi yang masuk", "Membuat keputusan alokasi sumber daya dan menangani konflik dalam organisasi", "Menjadi penghubung antar bagian dalam organisasi", "Memberikan konseling kepada bawahan"], "a": 1, "e": "Peran pengambil keputusan: mengalokasikan sumber daya dan menangani konflik/gangguan.", "f": false, "t": 6}, {"n": 39, "q": "Infrastruktur guna menyimpan, mengintegrasikan, menganalisa, dan melaporkan data yang berasal dari lingkungan bisnis disebut ....", "o": ["Pusat informasi", "Infrastruktur bisnis", "Intelegensi bisnis", "Alat analisis data bisnis"], "a": 2, "e": "Infrastruktur untuk menyimpan, mengintegrasikan, menganalisis, dan melaporkan data bisnis = intelegensi bisnis.", "f": false, "t": 6}, {"n": 40, "q": "Salah satu fasilitas intelegensi bisnis yang saat ini banyak digunakan adalah ....", "o": ["big data", "data mining", "analisis prediktif", "skenario"], "a": 2, "e": "Analitik prediktif termasuk kemampuan BI yang kini banyak dipakai. Pilihan lain juga berkaitan dengan BI, jadi cek lagi di modul.", "f": true, "t": 6}, {"n": 41, "q": "Merupakan tahapan komputerasi paling awal, yaitu mengubah proses manual menjadi diotomatiskan menggunakan komputer, merupakan pengertian dari ....", "o": ["pergeseran paradigma", "perancangan ulang proses bisnis", "rasionalisasi proses bisnis", "otomatisasi proses bisnis"], "a": 3, "e": "Tahap paling awal: mengotomatiskan proses manual = otomatisasi proses bisnis.", "f": false, "t": 7}, {"n": 42, "q": "Metodologi tertua dan pertama yang digunakan secara resmi oleh pemerintahan Inggris diawal dekade 1970an untuk mengembangkan sebuah sistem adalah ....", "o": ["AGILE", "RAD", "SDLC", "FAST"], "a": 2, "e": "SDLC adalah metodologi tertua dan dipakai pemerintah Inggris pada 1970-an.", "f": false, "t": 7}, {"n": 43, "q": "Menguji perangkat lunak untuk memastikan kelayakan operasional sebelum digunakan merupakan tahapan pengujian ....", "o": ["system testing", "unit testing", "integration testing", "operational acceptance testing"], "a": 3, "e": "Uji kelayakan operasional sebelum dipakai = operational acceptance testing.", "f": false, "t": 7}, {"n": 44, "q": "Indikator seberapa baik keluaran suatu proyek dapat memenuhi keinginan para pemangku kepentingan dan mencapai sasaran proyek adalah definisi dari ....", "o": ["risiko", "waktu", "biaya", "kualitas"], "a": 3, "e": "Kualitas mengukur seberapa baik keluaran memenuhi keinginan stakeholder dan sasaran proyek.", "f": false, "t": 7}, {"n": 45, "q": "Beberapa alat bantu yang dapat digunakan untuk memantau jalannya proyek, kecuali ....", "o": ["Gantt Chart", "PERT", "Enhance shopping cart functionality", "CPM"], "a": 2, "e": "Gantt, PERT, dan CPM adalah alat pemantauan proyek. 'Enhance shopping cart' adalah contoh fitur, bukan alat.", "f": false, "t": 7}, {"n": 46, "q": "Menurut (Laudon & Laudon, 2018) sistem informasi adalah ....", "o": ["jalur yang memfasilitasi aliran sumber daya fisik dari pemasok kepada perusahaan dan selanjutnya kepada pelanggan.", "data yang sudah mengalami pengolahan sedemikian rupa sehingga dapat digunakan oleh penggunanya dalam membuat keputusan.", "sistem yang digunakan untuk mengumpulkan, mengolah, menyimpan, dan mendistribusikan informasi.", "satu atribut (satu set atribut) yang melengkapi satu relationship (hubungan) yang menunjukkan ke induknya."], "a": 2, "e": "Laudon: SI mengumpulkan, mengolah, menyimpan, dan mendistribusikan informasi.", "f": false, "t": 0}, {"n": 47, "q": "Dalam perkembangannya, sistem informasi manajemen berkembang berdasarkan pengaruh besar dari beberapa disiplin ilmu, KECUALI ....", "o": ["operations research", "Ilmu Komputer", "Sosial", "Manajemen Sains"], "a": 2, "e": "SIM dipengaruhi pendekatan teknis (ilmu komputer, sains manajemen, operations research) dan perilaku. Kunci mengikuti pilihan yang paling umum di BMP; cek lagi.", "f": true, "t": 0}, {"n": 48, "q": "Perhatikan pernyataan-pernyataan berikut.\n1. sistem informasi manajemen\n2. sistem pendukung keputusan\n3. sistem informasi eksekutif\n4. sistem informasi persediaan\nBerdasarkan pernyataan di atas, yang termasuk dalam kategori sistem intelegensi bisnis menurut (Laudon, 2018 dan Turban et al, 2018) adalah ....", "o": ["1,2,3", "1,2,4", "1,3,4", "2,3,4"], "a": 0, "e": "Sistem BI untuk manajemen: SIM, DSS, dan sistem informasi eksekutif.", "f": false, "t": 0}, {"n": 49, "q": "Pada perusahaan besar, posisi manajer bagian sistem informasi berada sejajar dengan ....", "o": ["Chief Security Officer", "Manajer Administrasi dan Pergudangan", "Jajaran Direksi", "Chief Privacy Officer"], "a": 2, "e": "Manajer SI (CIO) berada di jajaran direksi/manajemen senior.", "f": false, "t": 0}, {"n": 50, "q": "Organisasi dikatakan sosial karena ....", "o": ["memiliki legitimasi secara legal dan memiliki seperangkat regulasi internal", "lebih tahan lama dibandingkan dengan kelompok informal seperti kelompok arisan teman kantor", "anggotanya adalah manusia yang berinteraksi satu dengan lainnya", "diseimbangkan sejalan dengan aktivitas organisasi"], "a": 2, "e": "Organisasi bersifat sosial karena anggotanya manusia yang saling berinteraksi.", "f": false, "t": 0}, {"n": 51, "q": "Salah satu alat yang sering digunakan untuk menganalisa persaingan dalam dunia bisnis adalah ....", "o": ["pengetahuan dan informasi", "model kekuatan persaingan", "model kekuatan pesaing", "akses pada sumber daya"], "a": 1, "e": "Model kekuatan persaingan Porter (five forces) dipakai untuk menganalisis persaingan.", "f": false, "t": 0}, {"n": 52, "q": "Dampak negative penggunaan teknologi dapat muncul akibat ....", "o": ["Peningkatan akses informasi yang mempercepat pengambilan keputusan", "Pengembangan inovasi yang menghasilkan produk dan layanan baru", "Peningkatan kolaborasi tim melalui platform digital", "Penyalahgunaan teknologi oleh manusia"], "a": 3, "e": "Dampak negatif teknologi muncul dari penyalahgunaan oleh manusia.", "f": false, "t": 1}, {"n": 53, "q": "Dampak dari perkembangan teknologi untuk tren kemajuan analisis data adalah ....", "o": ["Data terperinci setiap konsumen dapat disimpan dengan mudah dan dalam jangka waktu lama", "Data individual yang dikumpulkan secara terperinci mudah dianalisa untuk mendapatkan informasi yang mungkin sensitif", "Data dengan mudah dipindahkan dari satu lokasi ke lokasi lain", "Pengendalian dan kedaulatan atas data menjadi lebih sulit ditegakkan"], "a": 1, "e": "Kemajuan analisis data memudahkan pembentukan profil individu yang bisa mengungkap informasi sensitif.", "f": false, "t": 1}, {"n": 54, "q": "Cookies memiliki kemampuan antara lain untuk ....", "o": ["mempercepat koneksi internet dan menambah kecepatan jaringan", "mengidentifikasi aplikasi perambah apa yang digunakan pengunjung dan melacak aktivitas pengunjung selama kunjungannya", "menghapus data yang tersimpan di perangkat secara otomatis", "mengubah konten situs web sesuai dengan preferensi pengembang"], "a": 1, "e": "Cookies mengidentifikasi browser dan melacak aktivitas pengunjung.", "f": false, "t": 1}, {"n": 55, "q": "Informasi yang tidak diketahui oleh umum di bidang teknologi dan/atau bisnis merupakan definisi dari ....", "o": ["Hak Cipta", "Rahasia Dagang", "Merek Dagang", "Hak Paten"], "a": 1, "e": "Rahasia dagang: informasi teknologi/bisnis yang tidak diketahui umum.", "f": false, "t": 1}, {"n": 56, "q": "Penggunaan sistem dan teknologi informasi bagi setiap perusahaan tidak akan terlepas dari masalah ....", "o": ["manajemen", "organisasi", "sumber daya manusia", "biaya dan manfaat"], "a": 3, "e": "Penerapan SI selalu terkait analisis biaya dan manfaat. Cocokkan dengan BMP.", "f": true, "t": 0}, {"n": 57, "q": "Komputer yang dirancang khusus untuk Perusahaan skala besar dan memiliki kemampuan komputasi besar dengan kehandalan tinggi adalah ....", "o": ["Komputer personal", "Mainframe", "Client", "Enterprise computing"], "a": 1, "e": "Mainframe: komputer besar dengan daya komputasi dan keandalan tinggi.", "f": false, "t": 2}, {"n": 58, "q": "Untuk mempermudah manusia dalam mengingat alamat IP sebuah situs pada saat berselancar di internet maka dibuatlah layanan ....", "o": ["Domain Name Server (DNS)", "package switching", "router", "IP"], "a": 0, "e": "DNS menerjemahkan nama domain ke alamat IP.", "f": false, "t": 2}, {"n": 59, "q": "Program khusus yang secara mandiri menggandakan dirinya sendiri dari satu komputer ke komputer lain melalui jaringan komputer disebut dengan ....", "o": ["cookies", "spyware", "worm", "firmware"], "a": 2, "e": "Worm menggandakan diri sendiri lewat jaringan.", "f": false, "t": 3}, {"n": 60, "q": "Hasil audit sistem informasi dapat berisi ....", "o": ["Rekomendasi perbaikan", "Kondisi sistem", "Laporan NMAP", "Hasil testing aplikasi"], "a": 0, "e": "Laporan audit berisi temuan dan rekomendasi perbaikan.", "f": false, "t": 3}, {"n": 61, "q": "Kerangka kerja perangkat lunak yang digunakan untuk menangani data semi terstruktur dan tidak terstruktur dalam jumlah besar adalah ....", "o": ["in-memory computing", "online analytical processing (OLAP)", "query", "hadoop"], "a": 3, "e": "Hadoop menangani data besar semi-terstruktur dan tidak terstruktur.", "f": false, "t": 4}, {"n": 62, "q": "Menurut (Turban et al, 2018) alat pertama untuk menangani segala macam pengetahuan adalah ....", "o": ["ECM", "LMS", "SOP", "ISO"], "a": 0, "e": "Turban: ECM disebut sebagai alat pertama untuk menangani segala macam pengetahuan. Cek lagi di BMP.", "f": true, "t": 4}, {"n": 63, "q": "Enterprise Resource Planning (ERP) adalah rangkaian modul perangkat lunak yang terintegrasi dengan ....", "o": ["manufaktur dan operasi", "sumber daya manusia", "basis data terpusat", "akuntansi dan keuangan"], "a": 2, "e": "ERP: modul-modul terintegrasi yang berbagi basis data terpusat.", "f": false, "t": 5}, {"n": 64, "q": "Masalah utama dalam rangkaian pasokan adalah ....", "o": ["Kegagalan pemasaran", "Informasi dan koordinasi", "Manajemen aset", "Menumpuknya bahan baku"], "a": 1, "e": "Masalah utama rantai pasok: informasi dan koordinasi (memicu bullwhip effect).", "f": false, "t": 5}, {"n": 65, "q": "Di Indonesia, pelaku perdagangan elektronik pada tahun 2017 mencapai 4.5 juta dengan proporsi pengusaha mikro dengan pendapatan di bawah Rp300 juta per tahun sebesar ....", "o": ["97%", "98%", "99%", "100%"], "a": 2, "e": "Angka ini dari data BPS yang dikutip modul; tidak bisa saya pastikan. Cek lagi di BMP.", "f": true, "t": 5}, {"n": 66, "q": "Contoh penyedia pasar untuk tempat bertemu penjual dan pembeli adalah ....", "o": ["Traveloka", "Tokopedia", "Amazon", "Twitter"], "a": 1, "e": "Tokopedia adalah marketplace yang mempertemukan banyak penjual dan pembeli.", "f": false, "t": 5}, {"n": 67, "q": "Keputusan yang mengharuskan pembuat keputusan melakukan pertimbangan disebut keputusan ....", "o": ["Terstruktur", "Tidak terstruktur", "Semi terstruktur", "Organisasi"], "a": 1, "e": "Keputusan tidak terstruktur menuntut penilaian, evaluasi, dan wawasan pembuat keputusan.", "f": false, "t": 6}, {"n": 68, "q": "Dukungan teknologi yang dibutuhkan pada peran manajerial sebagai penghubung adalah ....", "o": ["tele conference dan video conference", "pesan singkat", "jejaring media sosial", "belum ada"], "a": 2, "e": "Laudon (edisi 2018), tabel peran manajerial: peran penghubung (liaison) didukung smartphone dan jejaring sosial. Edisi lama menyebut 'sistem komunikasi elektronik', jadi tetap cocokkan dengan BMP.", "f": true, "t": 6}, {"n": 69, "q": "Berikut merupakan cara intelegensi bisnis dalam menganalisis data guna mendapatkan informasi yang berkualitas tinggi kecuali ....", "o": ["mendalam", "komprehensif", "terintegrasi", "terpusat"], "a": 3, "e": "BI menganalisis data secara mendalam, komprehensif, dan terintegrasi; 'terpusat' bukan salah satunya. Cek lagi di BMP.", "f": true, "t": 6}, {"n": 70, "q": "Dalam berbagai paket perangkat lunak intelegensi bisnis, biasanya sudah ada berbagai model laporan berdasarkan ....", "o": ["penjualan", "area bisnis", "rantai pasokan", "pengadaan"], "a": 1, "e": "Paket BI biasanya menyediakan laporan siap pakai per area bisnis/industri.", "f": true, "t": 6}, {"n": 71, "q": "Proses menguji sebagian perangkat lunak secara tersendiri, merupakan pengertian dari ....", "o": ["System testing", "Unit testing", "Integration testing", "Operational acceptance testing"], "a": 1, "e": "Menguji satu bagian program secara terpisah = unit testing.", "f": false, "t": 7}, {"n": 72, "q": "Salah satu variabel besar yang menentukan keberhasilan suatu proyek adalah ....", "o": ["manajer proyek", "bentuk komitmen", "ukuran proyek", "ruang lingkup proyek"], "a": 2, "e": "Laudon: keberhasilan proyek dipengaruhi ukuran proyek, struktur, dan pengalaman teknologi.", "f": false, "t": 7}, {"n": 73, "q": "Menurut (Turban et al, 2018) contoh aspek non teknologi dalam sistem informasi adalah ....", "o": ["perangkat keras komputer", "manusia", "perangkat lunak komputer", "jaringan dan telekomunikasi data"], "a": 1, "e": "Aspek non-teknologi: manusia dan prosedur.", "f": false, "t": 0}, {"n": 74, "q": "Bentuk model usaha baru yang diakibatkan perkembangan teknologi informasi pada beberapa perubahan dalam dunia bisnis adalah ....", "o": ["komputasi awan (cloud computing)", "big data", "layanan streaming musik dan film", "marketplace"], "a": 2, "e": "Model usaha baru akibat TI, misalnya layanan streaming musik dan film. Cloud (no. 3) adalah inovasi teknologinya.", "f": true, "t": 0}, {"n": 75, "q": "Pada perusahaan besar, Chief Security Office bertanggung jawab terhadap ....", "o": ["pengelolaan dan pemanfaatan data perusahaan", "keamanan sistem informasi perusahaan", "kepatuhan regulasi privasi data perusahaan", "pengelolaan pengetahuan sistem informasi perusahaan"], "a": 1, "e": "Chief Security Officer bertanggung jawab atas keamanan SI.", "f": false, "t": 0}, {"n": 76, "q": "Dengan memiliki keunggulan kompetitif, suatu Perusahaan akan mendapatkan ....", "o": ["pengurangan dalam penggunaan teknologi informasi", "pertumbuhan pendapatan yang lebih baik", "hambatan dalam memperluas jaringan bisnisnya", "produktivitas penggunaan teknologi informasi"], "a": 1, "e": "Keunggulan kompetitif menghasilkan pertumbuhan pendapatan yang lebih baik.", "f": false, "t": 0}, {"n": 77, "q": "Hak eksklusif yang diberikan oleh negara kepada inventor atas hasil invensinya di bidang teknologi yang untuk selama waktu tertentu melaksanakan sendiri invensinya tersebut atau memberikan persetujuannya kepada pihak lain untuk melaksanakannya merupakan pengertian dari ....", "o": ["hak paten", "hak cipta", "merek dagang", "rahasia dagang"], "a": 0, "e": "Hak eksklusif negara kepada inventor atas invensi teknologi = paten.", "f": false, "t": 1}, {"n": 78, "q": "Dampak dari Perusahaan menggunakan fasilitas video conference adalah ....", "o": ["Menghemat biaya perjalanan dan akomodasi bagi para karyawan", "Meningkatkan kebutuhan ruang fisik untuk pertemuan tim", "Menghemat koneksi internet", "Mengurangi efektivitas rapat karena adanya kendala teknologi."], "a": 0, "e": "Video conference menghemat biaya perjalanan dan akomodasi.", "f": false, "t": 2}, {"n": 79, "q": "Campus Area Network (LAN) biasanya memiliki jangkauan sampai dengan ....", "o": ["1000 meter", "1500 meter", "2000 meter", "2500 meter"], "a": 0, "e": "Campus area network menjangkau hingga sekitar 1.000 meter.", "f": false, "t": 2}, {"n": 80, "q": "Potensi kerusakan atau kerugian atas berlangsungnya suatu risiko di masa mendatang disebut ....", "o": ["risiko", "kebijakan", "manajemen risiko", "pengendalian"], "a": 0, "e": "Risiko: potensi kerugian dari suatu kejadian di masa depan.", "f": false, "t": 3}, {"n": 81, "q": "Suatu yang hendak disimpan dan dikelola datanya oleh sebuah organisasi disebut ....", "o": ["binary", "field", "file", "entitas"], "a": 3, "e": "Hal yang datanya disimpan dan dikelola organisasi = entitas.", "f": false, "t": 4}, {"n": 82, "q": "Enterprise Content Management (ECM) digunakan untuk menangani pengetahuan yang bersifat ....", "o": ["tersimpan dalam dokumen elektronik", "terstruktur dan semi terstruktur", "tidak terstruktur dan tersebar di berbagai sumber", "hanya untuk arsip fisik perusahaan"], "a": 1, "e": "Laudon: Enterprise Content Management membantu mengelola pengetahuan terstruktur dan semi-terstruktur (dokumen, laporan, presentasi, e-mail).", "f": false, "t": 4}, {"n": 83, "q": "Augmented Reality (AR) menambahkan elemen visual pada lingkungan kita dapat dilihat melalui ....", "o": ["Percetakan tiga dimensi", "Computer-Aided Design (CAD)", "Simulasi", "Perangkat komputasi"], "a": 3, "e": "AR dilihat melalui perangkat komputasi (smartphone, tablet, kacamata AR).", "f": false, "t": 4}, {"n": 84, "q": "Pada ERP, dalam modul penjualan dan pemasaran terdapat proses ....", "o": ["administrasi pegawai", "penagihan", "penggajian", "presensi"], "a": 1, "e": "Penagihan (billing) ada di modul penjualan dan pemasaran.", "f": false, "t": 5}, {"n": 85, "q": "Pada peran pembuat keputusan, seorang manajer berperan sebagai ....", "o": ["penghubung", "pembuat keputusan utama", "pusat informasi", "kepala organisasi"], "a": 1, "e": "Peran pengambil keputusan (Mintzberg) mencakup wirausaha, penanganan gangguan, pengalokasi sumber daya, dan negosiator. Dari pilihan yang ada, hanya 'pembuat keputusan utama' yang termasuk peran ini; penghubung dan kepala organisasi adalah peran interpersonal, sedangkan pusat informasi adalah peran informasional.", "f": false, "t": 6}, {"n": 86, "q": "Menurut (Turban et al., 2006), alasan manajer membutuhkan bantuan teknologi informasi dalam membuat keputusan adalah sebagai berikut kecuali ....", "o": ["jumlah alternatif yang harus dipilih meningkat secara drastis", "keputusan sering harus dibuat dalam kendala waktu", "keputusan yang diambil agar lebih objektif", "akses informasi yang cepat harus diperoleh"], "a": 2, "e": "Turban: alternatif makin banyak, tekanan waktu, butuh akses informasi cepat. 'Lebih objektif' tidak termasuk.", "f": false, "t": 6}, {"n": 87, "q": "Infrastruktur intelegensi bisnis mengumpulkan, menyimpan, membersihkan, dan membuat informasi yang relevan tersedia bagi ....", "o": ["pusat informasi", "pelanggan", "juru bicara", "manajer"], "a": 3, "e": "Infrastruktur BI menyediakan informasi yang relevan bagi manajer.", "f": false, "t": 6}, {"n": 88, "q": "Perusahaan mengubah pandangannya mengenai lingkungan bisnis, merupakan pengertian dari ....", "o": ["pergeseran paradigma", "perancangan ulang proses bisnis", "rasionalisasi proses bisnis", "otomatisasi proses bisnis"], "a": 0, "e": "Mengubah cara pandang terhadap bisnis = pergeseran paradigma.", "f": false, "t": 7}, {"n": 89, "q": "Salah satu metode pengembangan sistem adalah agile. Dalam Bahasa Indonesia, agile berarti ....", "o": ["hati-hati", "kaku", "tangkas", "sederhana"], "a": 2, "e": "Agile berarti tangkas.", "f": false, "t": 7}]}, {"code": "STSI4209", "name": "Pemrograman Berbasis Web", "topics": ["HTML, CSS & web", "JavaScript", "Canvas", "Vue.js"], "qs": [{"n": 1, "q": "Seorang mahasiswa membuat blog pribadi untuk menulis opini, artikel, dan berbagi karya. Manfaat website dalam hal ini adalah ....", "o": ["Penuangan ide dan gagasan", "Meningkatkan bisnis", "Tampil profesional", "Sarana promosi"], "a": 0, "e": "Blog untuk menulis opini dan berbagi karya = manfaat penuangan ide dan gagasan.", "f": false, "t": 0}, {"n": 2, "q": "Protokol dasar yang digunakan untuk mentransfer halaman web adalah ....", "o": ["HTTP", "FTP", "DNS", "TCP/IP"], "a": 0, "e": "Halaman web ditransfer dengan HTTP.", "f": false, "t": 0}, {"n": 3, "q": "Elemen HTML yang digunakan untuk membuat hyperlink/link adalah ....", "o": ["<nav>", "<link>", "<href>", "<a>"], "a": 3, "e": "Hyperlink dibuat dengan <a href=\"...\">. Tag <link> untuk menautkan file seperti CSS.", "f": false, "t": 0}, {"n": 4, "q": "Dalam aturan CSS, bagian yang menentukan elemen HTML mana yang akan diubah adalah ....", "o": ["Properti", "Tag", "Nilai", "Selector"], "a": 3, "e": "Selector menentukan elemen HTML yang diberi gaya.", "f": false, "t": 0}, {"n": 5, "q": "Agar kode JavaScript yang bersifat penting dapat diproses lebih awal, sebaiknya tag <script> diletakkan di ....", "o": ["Awal <head>", "Tengah <body>", "Bagian akhir sebelum <\/body>", "Di dalam atribut <style>"], "a": 0, "e": "Script yang harus diproses lebih awal diletakkan di <head>. Praktik umum lain adalah menaruh script sebelum <\/body> agar halaman tampil dulu, jadi cocokkan dengan BMP.", "f": true, "t": 0}, {"n": 6, "q": "Jika kode berikut dijalankan:\nlet umur = 20;\nlet status = \"mahasiswa\";\nif (umur >= 18) {\n  if (status === \"mahasiswa\") {\n    console.log(\"Diskon 50%\");\n  } else {\n    console.log(\"Diskon 10%\");\n  }\n} else {\n  console.log(\"Tidak dapat diskon\");\n}\nMaka hasilnya adalah ....", "o": ["Diskon 10%", "Tidak dapat diskon", "Error", "Diskon 50%"], "a": 3, "e": "umur 20 ≥ 18 dan status === \"mahasiswa\", jadi yang tercetak \"Diskon 50%\".", "f": false, "t": 1}, {"n": 7, "q": "Perhatikan kode program berikut:\nlet total = 0;\nfor (let i = 1; i <= 4; i++) {\n  total += i;\n}\nconsole.log(total);\nOutput dari program di atas?", "o": ["20", "15", "10", "5"], "a": 2, "e": "1 + 2 + 3 + 4 = 10.", "f": false, "t": 1}, {"n": 8, "q": "Jika menggunakan Vue.js dengan CDN, maka untuk menghubungkan Vue instance dengan HTML perlu menggunakan atribut ....", "o": ["src", "class", "id pada elemen HTML", "href"], "a": 2, "e": "Vue instance dihubungkan lewat el: '#app', yang merujuk ke id elemen HTML.", "f": false, "t": 3}, {"n": 9, "q": "Perhatikan kode program berikut:\n<div id=\"app\">\n  <p>{{ angka + 5 }}<\/p>\n<\/div>\n<script>\nnew Vue({\n  el: '#app',\n  data: {\n    angka: 10\n  }\n})\n<\/script>\nOutput di browser adalah ....", "o": ["Error", "angka + 5", "10 + 5", "15"], "a": 3, "e": "Interpolasi {{ angka + 5 }} mengevaluasi ekspresi: 10 + 5 = 15.", "f": false, "t": 3}, {"n": 10, "q": "Perhatikan kode program berikut:\n<div id=\"app\">\n  <p v-text=\"pesan\"><\/p>\n  <p>{{ pesan }}<\/p>\n<\/div>\n<script>\nnew Vue({\n  el: '#app',\n  data: {\n    pesan: 'Hello Vue!'\n  }\n})\n<\/script>\nOutput dari kode program di atas adalah ....", "o": ["<p v-text=\"pesan\"><\/p> <p>{{ pesan }}<\/p>", "Hello Vue! (satu baris)", "Hello Vue! Hello Vue!", "Hello Vue! (baris 1) dan Hello Vue! (baris 2)"], "a": 3, "e": "v-text dan {{ }} sama-sama menampilkan teks, jadi muncul dua paragraf \"Hello Vue!\".", "f": false, "t": 3}, {"n": 11, "q": "Perhatikan potongan kode program berikut:\n<div id=\"app\">\n  <p v-text=\"x + y\"><\/p>\n<\/div>\n<script>\nnew Vue({\n  el: '#app',\n  data: { x: '10', y: 2 }\n})\n<\/script>\nOutput layar kode program di atas adalah ....", "o": ["12", "10+2", "10", "102"], "a": 3, "e": "'10' (string) + 2 menghasilkan penggabungan string \"102\".", "f": false, "t": 3}, {"n": 12, "q": "Simak kode program berikut:\n<div id=\"app\">\n  <p>{{ pesan }}<\/p>\n  <p v-html=\"pesan\"><\/p>\n<\/div>\n<script>\nnew Vue({\n  el: '#app',\n  data: { pesan: '<i>Belajar Vue<\/i>' }\n})\n<\/script>\nOutput dari kode program di atas adalah ....", "o": ["Belajar Vue (tanpa miring) dan <i>Belajar Vue<\/i>", "<i>Belajar Vue<\/i> dan Belajar Vue (miring)", "Belajar Vue (tanpa miring) dan Belajar Vue (miring)", "Error"], "a": 1, "e": "{{ }} menampilkan HTML sebagai teks mentah; v-html merendernya, jadi teks tampil miring.", "f": false, "t": 3}, {"n": 13, "q": "Perhatikan kodingan berikut:\n<div id=\"app\">\n  <p v-if=\"judul\">Judul: {{ judul }}<\/p>\n  <p v-else>Tidak ada judul<\/p>\n<\/div>\n<script>\nnew Vue({\n  el: '#app',\n  data: { judul: 'Belajar Vue' }\n})\n<\/script>\nOutput dari kode program di atas adalah ....", "o": ["Judul: Belajar Vue", "Tidak ada judul", "Error", "Kosong"], "a": 0, "e": "judul berisi string tidak kosong (truthy), jadi v-if dirender.", "f": false, "t": 3}, {"n": 14, "q": "Perhatikan kodingan berikut:\n<div id=\"app\">\n  <p v-if=\"aktif\" v-show=\"tampil\">Panel Aktif<\/p>\n  <p v-else>Panel Nonaktif<\/p>\n<\/div>\n<script>\nnew Vue({\n  el: '#app',\n  data: { aktif: false, tampil: true }\n})\n<\/script>\nOutput dari kodingan di atas adalah ....", "o": ["Panel Aktif", "Panel Aktif (tersembunyi)", "Panel Nonaktif", "Tidak ada apa pun"], "a": 2, "e": "aktif false, jadi v-if gagal dan v-else yang tampil.", "f": false, "t": 3}, {"n": 15, "q": "Perhatikan kodingan berikut:\n<div id=\"app\">\n  <p v-bind:class=\"warna\">Teks<\/p>\n<\/div>\n<script>\nnew Vue({\n  el: '#app',\n  data: { warna: 'merah' }\n})\n<\/script>\nJika di CSS ada .merah { color: red; }, maka apa tampilan teks?", "o": ["Teks berwarna merah", "Teks biru", "Teks merah {{ warna }}", "biru dan merah tampil"], "a": 0, "e": "v-bind:class=\"warna\" memberi class \"merah\", jadi teks berwarna merah.", "f": false, "t": 3}, {"n": 16, "q": "Perhatikan baris program berikut:\n<div id=\"app\">\n  <input v-model=\"x\" type=\"text\">\n  <input v-model.number=\"y\" type=\"text\">\n  <p>{{ x + y }}<\/p>\n<\/div>\n<script>\nnew Vue({\n  el: '#app',\n  data: { x: '10', y: 5 }\n})\n<\/script>\nKeluaran dari kode program di atas adalah ....", "o": ["15", "105", "10+5", "Error"], "a": 1, "e": "x tetap string '10' (tanpa .number), y angka 5, jadi '10' + 5 = \"105\".", "f": false, "t": 3}, {"n": 17, "q": "Perhatikan kodingan berikut:\n<div id=\"app\">\n  <input v-model=\"usernameView\">\n  <p>{{ username }}<\/p>\n<\/div>\n<script>\nnew Vue({\n  el: '#app',\n  data: {\n    username: 'Kani'\n  },\n  computed: {\n    usernameView() {\n      return this.username.toLowerCase();\n    }\n  }\n})\n<\/script>\nOutput dari kodingan di atas adalah ....", "o": ["KANI", "kani", "Kosong", "Error"], "a": 1, "e": "Diuji di Vue 2.7: input menampilkan 'kani' (hasil computed toLowerCase), sedangkan <p> tetap 'Kani'. Karena 'Kani' tidak ada di pilihan, jawaban yang dimaksud adalah 'kani'.", "f": true, "t": 3}, {"n": 18, "q": "Perhatikan kode program berikut:\n<div id=\"app\">\n  <label><input type=\"radio\" v-model=\"level\" value=\"silver\"> Silver<\/label>\n  <label><input type=\"radio\" v-model=\"level\" value=\"gold\"> Gold<\/label>\n  <label><input type=\"radio\" v-model=\"level\" value=\"platinum\"> Platinum<\/label>\n  <p>Total: {{ total }}<\/p>\n<\/div>\n<script>\nnew Vue({\n  el: '#app',\n  data: {\n    harga: 100,\n    level: 'gold' // nilai awal\n  },\n  computed: {\n    diskon() {\n      switch(this.level) {\n        case 'gold': return 0.10;\n        case 'platinum': return 0.20;\n        default: return 0; // silver\n      }\n    },\n    total() {\n      return this.harga * (1 - this.diskon);\n    }\n  }\n})\n<\/script>\nNilai Total saat render pertama adalah ....", "o": ["80", "90", "100", "120"], "a": 1, "e": "Level awal gold → diskon 0,10 → 100 × 0,9 = 90.", "f": false, "t": 3}, {"n": 19, "q": "Perhatikan kode program berikut:\n<div id=\"app\">\n  <button @click=\"salam\">Klik<\/button>\n  <p>{{ salam() }}<\/p>\n<\/div>\n<script>\nnew Vue({\n  el: '#app',\n  data: { nama: 'Budi' },\n  methods: {\n    salam() { return \"Halo \" + this.nama; }\n  }\n})\n<\/script>\nSaat halaman dimuat dan tombol diklik, apa perilaku yang benar?", "o": ["<p> kosong, tombol memunculkan alert", "<p> menampilkan \"Halo Budi\", tombol tidak melakukan apa-apa", "<p> menampilkan \"Halo Budi\", tombol juga menampilkan \"Halo Budi\" di console", "Error karena methods tidak bisa dipanggil di template dan event bersamaan"], "a": 1, "e": "{{ salam() }} menampilkan \"Halo Budi\"; klik tombol hanya mengembalikan string tanpa efek yang terlihat.", "f": false, "t": 3}, {"n": 20, "q": "Jika di template kita menulis {{ kaliDua }} dan {{ kaliDua() }}, apa kemungkinan perbedaannya?", "o": ["{{ kaliDua }} merujuk ke computed, sedangkan {{ kaliDua() }} memanggil methods", "Keduanya merujuk ke methods", "Keduanya merujuk ke computed", "Tidak bisa dipakai di template"], "a": 0, "e": "Tanpa kurung merujuk ke computed; dengan kurung memanggil method.", "f": false, "t": 3}, {"n": 21, "q": "Hasil dari ekspresi:\nNumber(\"10\") + true + 9\nadalah ....", "o": ["20", "\"1010\"", "\"20\"", "NaN"], "a": 0, "e": "Number(\"10\") = 10, true = 1, jadi 10 + 1 + 9 = 20.", "f": false, "t": 1}, {"n": 22, "q": "Perhatikan program berikut:\n<div id=\"app\">\n  <p>{{ buah[buah.length - 1] }}<\/p>\n<\/div>\n<script>\nnew Vue({\n  el: '#app',\n  data: { buah: ['Apel', 'Jeruk', 'Mangga', 'Pisang'] }\n})\n<\/script>\nApa yang ditampilkan?", "o": ["Apel", "Jeruk", "Mangga", "Pisang"], "a": 3, "e": "buah.length − 1 = 3, yaitu elemen terakhir \"Pisang\". \">\n  <input v-model=\"usernameView\">\n  <p>{{ username }}<\/p>\n<\/div>\n<script>\nnew Vue({\n  el: '#app',\n  data: {\n    username: 'Kani'\n  },\n  computed: {\n    usernameView() {\n      return this.username.toUpperCase();\n    }\n  }\n})\n<\/script>\nSaat pengguna mengetik \"kani123\" pada input, apa yang terjadi?", "o": ["<p> berubah menjadi kani123", "<p> tetap Kani; input menampilkan KANI123, tapi perubahan tidak tersinkron ke username", "<p> berubah menjadi KANI123", "Error runtime karena computed tidak punya setter"], "a": 1, "e": "Diuji di Vue 2.7: <p> tetap 'Kani' dan Vue hanya memberi peringatan bahwa computed tanpa setter tidak bisa diubah, bukan error runtime. Bagian 'KANI123' di pilihan B kurang tepat (input berisi apa yang diketik), tapi B paling sesuai.", "f": true, "t": 3}, {"n": 38, "q": "Perhatikan kode program berikut:\n<div id=\"app\">\n  <button @click=\"tambah\">Tambah<\/button>\n  <p>Nilai: {{ counter }}<\/p>\n<\/div>\n<script>\nnew Vue({\n  el: '#app',\n  data: { counter: 0 },\n  methods: {\n    tambah() { this.counter++; }\n  }\n})\n<\/script>\nSaat halaman dimuat dan tombol diklik sekali, apa perilaku yang benar?", "o": ["<p> tetap menampilkan \"Nilai: 0\"", "<p> menampilkan \"Nilai: 1\"", "<p> menampilkan \"Nilai: tambah\"", "Error karena counter bukan method"], "a": 1, "e": "Klik menjalankan counter++, jadi tampil \"Nilai: 1\".", "f": false, "t": 3}, {"n": 39, "q": "Perhatikan kode program berikut:\n<div id=\"app\">\n  <p>{{ kuadrat }}<\/p>\n  <p>{{ kuadrat() }}<\/p>\n<\/div>\n<script>\nnew Vue({\n  el: '#app',\n  data: { angka: 4 },\n  computed: {\n    kuadrat() { return this.angka * this.angka; }\n  },\n  methods: {\n    kuadrat() { return this.angka ** 2; }\n  }\n})\n<\/script>\nPernyataan yang benar adalah ....", "o": ["{{ kuadrat }} memanggil computed property, sedangkan {{ kuadrat() }} memanggil method", "Keduanya hanya memanggil computed property", "Keduanya hanya memanggil method", "Keduanya akan error"], "a": 0, "e": "Diuji di Vue 2.7: Vue memberi peringatan karena nama computed bentrok dengan method; {{ kuadrat() }} menghasilkan 16. Konsep yang diuji soal: tanpa kurung = computed, dengan kurung = method.", "f": true, "t": 3}, {"n": 40, "q": "Hasil dari ekspresi:\n\"10\" + 10\nadalah ....", "o": ["20", "\"1010\"", "\"20\"", "\"10 + 10\""], "a": 1, "e": "String + angka = penggabungan string: \"1010\".", "f": false, "t": 1}, {"n": 41, "q": "Perhatikan program berikut:\n<div id=\"app\">\n  <p>{{ buah[0].toUpperCase() }}<\/p>\n<\/div>\n<script>\nnew Vue({\n  el: '#app',\n  data: { buah: ['Apel', 'Jeruk', 'Mangga', 'Pisang'] }\n})\n<\/script>\nApa yang ditampilkan?", "o": ["apel", "Apel", "APEL", "Error"], "a": 2, "e": "buah[0] = 'Apel', lalu toUpperCase() menjadi \"APEL\".", "f": false, "t": 3}, {"n": 42, "q": "Perhatikan kode program berikut:\nconst s = \"universitas\";\nconst a = s.slice(2, -1);\nconsole.log(a);\nVariabel a akan berisi nilai ....", "o": ["\"universita\"", "\"iversita\"", "\"iversitas\"", "\"versita\""], "a": 1, "e": "\"universitas\".slice(2, −1) = \"iversita\".", "f": false, "t": 1}, {"n": 43, "q": "Jika terdapat kode program berikut:\n<div id=\"app\">\n  <p>{{ pesan }}<\/p>\n<\/div>\n<script>\nnew Vue({\n  el: '#app',\n  data: {\n    pesan: \"Belajar\\nVue\\nMenyenangkan\"\n  }\n})\n<\/script>\nBagaimana hasil tampilannya di browser?", "o": ["Belajar Vue Menyenangkan (satu baris)", "Belajar, lalu baris baru Vue, lalu baris baru Menyenangkan", "Error karena karakter \\n tidak valid", "Hanya menampilkan \"Belajar\""], "a": 0, "e": "Diuji di Vue 2.7: \\n dalam teks HTML diciutkan menjadi spasi, jadi tampil 'Belajar Vue Menyenangkan' dalam satu baris.", "f": false, "t": 3}, {"n": 44, "q": "Untuk menggambar segitiga menggunakan Canvas API, perintah dasar yang paling tepat adalah ....", "o": ["ctx.fillRect(0,0,100,100)", "ctx.beginPath(); ctx.moveTo(...); ctx.lineTo(...); ctx.lineTo(...); ctx.closePath(); ctx.fill();", "ctx.arc(0,0,50,0,Math.PI*2)", "ctx.strokeRect(0,0,50,50)"], "a": 1, "e": "Segitiga digambar dengan beginPath, moveTo, dua lineTo, closePath, fill.", "f": false, "t": 2}, {"n": 45, "q": "Protokol apa yang menjadi dasar utama untuk komunikasi jaringan internet, termasuk mendukung transfer data seperti halaman web, email, dan file?", "o": ["HTTP", "FTP", "DNS", "TCP/IP"], "a": 3, "e": "TCP/IP adalah dasar komunikasi Internet; HTTP, FTP, dan email berjalan di atasnya.", "f": false, "t": 0}, {"n": 46, "q": "Perhatikan kode program berikut:\n<div id=\"app\">\n  <p>{{ angka + 5 }}<\/p>\n  <p>{{ angka + 4 }}<\/p>\n<\/div>\n<script>\nnew Vue({\n  el: '#app',\n  data: {\n    angka: 10\n  }\n})\n<\/script>\nOutput di browser adalah ....", "o": ["15 dan 19", "15 dan 15", "15 dan 14", "15 saja"], "a": 2, "e": "10 + 5 = 15 dan 10 + 4 = 14.", "f": false, "t": 3}, {"n": 47, "q": "Perhatikan kode program berikut:\n<div id=\"app\">\n  <label><input type=\"radio\" v-model=\"paket\" value=\"basic\"> Basic<\/label>\n  <label><input type=\"radio\" v-model=\"paket\" value=\"premium\"> Premium<\/label>\n  <label><input type=\"radio\" v-model=\"paket\" value=\"vip\"> VIP<\/label>\n  <p>Total: {{ total }}<\/p>\n<\/div>\n<script>\nnew Vue({\n  el: '#app',\n  data: {\n    harga: 100,\n    paket: 'basic'\n  },\n  computed: {\n    diskon() {\n      switch(this.paket) {\n        case 'premium': return 0.10;\n        case 'vip': return 0.20;\n        default: return 0;\n      }\n    },\n    total() {\n      return this.harga * (1 - this.diskon);\n    }\n  }\n})\n<\/script>\nNilai Total saat render pertama adalah ....", "o": ["80", "90", "100", "120"], "a": 2, "e": "Paket awal basic → diskon 0 → total 100.", "f": false, "t": 3}, {"n": 48, "q": "Jika terdapat kodingan sebagai berikut:\ndata: { count: 0 },\nwatch: {\n  count(newVal, oldVal) {\n    console.log(`Count berubah dari ${oldVal} ke ${newVal}`);\n  }\n}\nApa yang terjadi jika this.count++ dipanggil?", "o": ["Tidak ada perubahan", "Console menampilkan Count berubah dari 0 ke 1", "Error, watch tidak mendukung perubahan data", "Count menjadi 0"], "a": 1, "e": "count berubah dari 0 ke 1, jadi watcher mencetak pesan itu.", "f": false, "t": 3}, {"n": 49, "q": "Perhatikan kode program berikut:\nctx.fillRect(10, 20, 100, 50)\nKode di atas digunakan untuk ....", "o": ["Menggambar persegi panjang dengan garis tepi saja", "Menggambar persegi panjang penuh (terisi warna)", "Membuat path persegi panjang tanpa mengisi warna", "Menggambar persegi panjang dengan method drawRect"], "a": 1, "e": "fillRect menggambar persegi panjang penuh di (10,20) berukuran 100×50.", "f": false, "t": 2}, {"n": 50, "q": "Manakah pasangan class yang dipakai saat elemen baru dimasukkan (enter)?", "o": ["v-leave, v-leave-active, v-leave-to", "v-enter, v-enter-active, v-enter-to", "v-enter-active, v-leave-active", "v-show dan v-if"], "a": 1, "e": "Class saat elemen masuk: v-enter, v-enter-active, v-enter-to.", "f": false, "t": 3}]}];
const L='ABCD',$=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}},put=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let CI=Math.max(0,ALL.findIndex(c=>c.code===get('ut-latihan-mk'))),QS,TOP,KEY,S,tmr,VIEW=get('ut-latihan-view')==='kunci'?'kunci':'soal';
const fresh=(mode,topic,rand,list)=>{const base=list||QS.filter(q=>topic<0||q.t===topic).map(q=>q.n);
 return{mode,topic,rand,order:rand?shuf(base):base,perm:Object.fromEntries(base.map(n=>[n,rand?shuf([0,1,2,3]):[0,1,2,3]])),ans:{},cur:0,done:false,res:false,start:Date.now(),end:0}};
const Q=n=>QS[n-1],shown=n=>S.mode==='lat'?S.ans[n]!=null:S.done,right=n=>S.ans[n]===Q(n).a;
const prose=l=>/^[A-Z][a-z]/.test(l)&&/(:|\.{3,}|\?)$/.test(l.trim());
function fmtQ(q){if(!/[;{}]|<\w|ctx\./.test(q)||!q.includes('\n'))return esc(q);
 const out=[];let code=[];const flush=()=>{if(code.length){out.push(`<pre class="code">${esc(code.join('\n'))}</pre>`);code=[]}};
 for(const l of q.split('\n')){if(prose(l)){flush();out.push(`<div>${esc(l)}</div>`)}else code.push(l)}flush();return out.join('')}
const isCode=t=>/;|<\/?\w|\{\{|ctx\.|^["'`]/.test(t);
function load(ci){CI=ci;const c=ALL[ci];QS=c.qs;TOP=c.topics;KEY=c.code.toLowerCase()+'-latihan-v1';put('ut-latihan-mk',c.code);
 try{S=JSON.parse(get(KEY))}catch(e){S=null}
 if(!S||!Array.isArray(S.order)||!S.order.length||S.order.some(n=>!QS[n-1]))S=fresh('lat',-1,false);
 document.title=c.name+' · Latihan';
 $('course').innerHTML=ALL.map((x,i)=>`<option value="${i}"${i===ci?' selected':''}>${esc(x.name)} (${esc(x.code)})</option>`).join('');
 $('topic').innerHTML=`<option value="-1">Semua topik (${QS.length})</option>`+TOP.map((t,i)=>`<option value="${i}"${S.topic===i?' selected':''}>${esc(t)} (${QS.filter(q=>q.t===i).length})</option>`).join('');
 render()}
function render(){
 const K=VIEW==='kunci';document.body.classList.toggle('key',K);put('ut-latihan-view',VIEW);
 $('mLat').setAttribute('aria-pressed',!K&&S.mode==='lat');$('mUji').setAttribute('aria-pressed',!K&&S.mode==='uji');$('mKey').setAttribute('aria-pressed',K);
 if(K){$('topic').value=S.topic;clearInterval(tmr);return keys()}$('rnd').checked=S.rand;$('topic').value=S.topic;
 const ns=S.order,ans=ns.filter(n=>S.ans[n]!=null),ok=ans.filter(right).length;
 $('score').textContent=S.mode==='lat'||S.done?`${ok} benar · ${ans.length-ok} salah · ${ans.length}/${ns.length}`:`${ans.length}/${ns.length} dijawab`;

 S.res&&S.done?result():card();grid();put(KEY,JSON.stringify(S));tick()}
function card(){
 const n=S.order[S.cur],q=Q(n),p=S.perm[n],a=S.ans[n],sh=shown(n),last=S.cur===S.order.length-1;
 const opts=p.map((oi,pos)=>{let c='opt';if(sh){c+=oi===q.a?' ok':oi===a?' bad':' dim'}else if(oi===a)c+=' sel';
  return`<button class="${c}" data-o="${oi}"${sh?' disabled':''}><span class="k">${L[pos]}</span><span class="tx${isCode(q.o[oi])?' mono':''}">${esc(q.o[oi])}</span></button>`}).join('');
 let ex='';if(sh){const kp=L[p.indexOf(q.a)],v=a==null?'<span class="v">Tidak dijawab.</span>':a===q.a?'<span class="v ok">Benar.</span>':'<span class="v bad">Belum tepat.</span>';
  ex=`<div class="ex">${v} Jawaban: <b>${kp}</b>. ${esc(q.e)}${q.f?'<span class="w">Soal ini ambigu atau bergantung pada istilah khusus di modul. Cocokkan dengan BMP.</span>':''}</div>`}
 const tail=S.mode==='uji'&&!S.done?(last?'<button class="btn pri" id="fin">Selesai &amp; nilai</button>':'<button class="btn pri" id="next">Berikutnya</button>')
  :`<button class="btn pri" id="next"${last?' disabled':''}>Berikutnya</button>`;
 $('view').innerHTML=`<div class="meta">Soal ${S.cur+1} dari ${S.order.length} · ${esc(TOP[q.t])}${S.mode==='uji'&&!S.done?' · <span id="tm"></span>':''}${S.mode==='uji'&&S.done?' · <button class="link" id="showRes">Lihat nilai</button>':''}</div>
 <div class="qt">${fmtQ(q.q)}</div><div class="opts">${opts}</div>${ex}
 <div class="nav"><button class="btn" id="prev"${S.cur?'':' disabled'}>Sebelumnya</button><span class="sp"></span>${S.mode==='uji'&&!S.done&&!last?'<button class="btn" id="fin">Selesai</button>':''}${tail}</div>`}
function keys(){const t=+$('topic').value,w=$('cari').value.trim().toLowerCase();
 const list=QS.filter(q=>(t<0||q.t===t)&&(!w||(q.q+' '+q.o.join(' ')).toLowerCase().includes(w)));
 $('view').innerHTML=list.length?list.map(q=>`<article class="ki"><div class="meta">No. ${q.n} · ${esc(TOP[q.t])}</div><div class="qt">${fmtQ(q.q)}</div>
 <ul class="kl">${q.o.map((o,i)=>`<li class="${i===q.a?'ok':''}"><span class="k">${L[i]}</span><span class="tx${isCode(o)?' mono':''}">${esc(o)}</span>${i===q.a?'<span class="chk" aria-label="Jawaban benar">✓</span>':''}</li>`).join('')}</ul>
 <div class="ke">${esc(q.e)}${q.f?' <span class="w">· Ambigu, cocokkan dengan BMP.</span>':''}</div></article>`).join(''):'<p class="empty">Tidak ada soal yang cocok.</p>'}
function grid(){$('grid').innerHTML=S.order.map((n,i)=>{const a=S.ans[n];let c='cell';if(a!=null)c+=shown(n)?(right(n)?' g':' x'):' a';else if(shown(n))c+=' x';
 return`<button class="${c}${i===S.cur?' cur':''}" data-i="${i}">${i+1}</button>`}).join('')}
function result(){const ns=S.order,ok=ns.filter(right).length,pct=Math.round(ok/ns.length*100),m=Math.max(1,Math.round((S.end-S.start)/60000));
 const rows=TOP.map((t,i)=>{const s=ns.filter(n=>Q(n).t===i);if(!s.length)return'';const k=s.filter(right).length;
  return`<div class="row"><span>${esc(t)}</span><div class="bar"><div style="width:${k/s.length*100}%"></div></div><span class="n">${k}/${s.length}</span></div>`}).join('');
 const w=ns.length-ok;
 $('view').innerHTML=`<div class="res"><div class="meta">Hasil ujian · ${m} menit</div><h2>Nilai ${pct}</h2><div>${ok} benar dari ${ns.length} soal.</div>
 <div class="rows">${rows}</div><div class="nav"><button class="btn" id="review">Lihat pembahasan</button>${w?`<button class="btn" id="redo">Ulangi ${w} yang salah</button>`:''}<span class="sp"></span><button class="btn pri" id="again">Ujian baru</button></div></div>`}
function tick(){clearInterval(tmr);if(S.mode!=='uji'||S.done)return;const f=()=>{const e=$('tm');if(!e)return;const s=(Date.now()-S.start)/1000|0;e.textContent=`${s/60|0}:${String(s%60).padStart(2,'0')}`};f();tmr=setInterval(f,1000)}
function choose(oi){const n=S.order[S.cur];if(shown(n))return;S.ans[n]=oi;render()}
function go(i){if(i<0||i>=S.order.length)return;S.cur=i;S.res=false;render()}
const restart=list=>{S=fresh(S.mode,list?-1:S.topic,S.rand,list);render()};
$('course').onchange=e=>load(+e.target.value);
$('topic').onchange=e=>{if(VIEW==='kunci')return keys();S=fresh(S.mode,+e.target.value,S.rand);render()};
$('cari').oninput=()=>keys();
$('rnd').onchange=e=>{S.rand=e.target.checked;restart()};
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.o!=null)return choose(+t.dataset.o);
 if(t.dataset.i!=null){go(+t.dataset.i);$('det').open=false;return scrollTo(0,0)}
 switch(t.id){case'prev':return go(S.cur-1);case'next':return go(S.cur+1);case'rst':return restart();
  case'mKey':VIEW='kunci';render();return scrollTo(0,0);
  case'mLat':case'mUji':{const m=t.id==='mLat'?'lat':'uji',was=VIEW;VIEW='soal';if(m!==S.mode){const tp=was==='kunci'?+$('topic').value:S.topic;S=fresh(m,tp,m==='uji'||S.rand)}render();return}
  case'fin':S.done=true;S.end=Date.now();S.res=true;return render();
  case'showRes':S.res=true;return render();
  case'review':S.res=false;S.cur=0;return render();
  case'redo':{const w=S.order.filter(n=>!right(n));S.mode='lat';return restart(w)}
  case'again':return restart()}});
document.addEventListener('keydown',e=>{if(VIEW==='kunci'||e.metaKey||e.ctrlKey||e.altKey||/SELECT|INPUT/.test(e.target.tagName))return;const k=e.key.toUpperCase();
 if(k.length===1&&L.includes(k)){const n=S.order[S.cur];if(n&&!S.res)choose(S.perm[n][L.indexOf(k)])}
 else if(e.key==='ArrowRight')go(S.cur+1);else if(e.key==='ArrowLeft')go(S.cur-1)});
load(CI);
}
</script>
</body>
</html>
